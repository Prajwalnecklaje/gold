<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow DOM Selector Reproduction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f7f8fa;
      color: #222;
    }
    .card {
      max-width: 800px;
      margin: auto;
      padding: 24px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    h1 { margin-top: 0; }
    .hint {
      padding: 12px 16px;
      background: #f0f4ff;
      border-left: 4px solid #5b6cff;
      margin: 20px 0;
    }
    #network-tab {
      display: block;
      margin-top: 20px;
      padding: 20px;
      border: 2px dashed #999;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Shadow DOM Selector Reproduction</h1>

    <p>
      This page intentionally creates a shadow DOM structure similar to:
    </p>

    <pre>#network-tab[data-pendo-id="network-tab"]::shadow ion-tab-button</pre>

    <div class="hint">
      Open DevTools and inspect <strong>#network-tab</strong>.
      It is a shadow host containing an <strong>ion-tab-button</strong>.
    </div>

    <div id="network-tab" data-pendo-id="network-tab"></div>
  </div>

  <script>
    const host = document.querySelector("#network-tab");

    const shadow = host.attachShadow({ mode: "open" });

    shadow.innerHTML = `
      <style>
        :host {
          display: block;
          background: #fafafa;
        }

        .wrapper {
          display: flex;
          gap: 12px;
          align-items: center;
        }

        ion-tab-button {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-width: 160px;
          padding: 12px 18px;
          border-radius: 6px;
          border: 1px solid #aaa;
          background: white;
          cursor: pointer;
          font-family: Arial, sans-serif;
        }

        ion-tab-button.active {
          border-color: #5b6cff;
          background: #eef0ff;
        }
      </style>

      <div class="wrapper">
        <ion-tab-button class="network-tab-button" data-testid="network-button">
          Network
        </ion-tab-button>
      </div>
    `;

    const button = shadow.querySelector("ion-tab-button");

    button.addEventListener("click", () => {
      button.classList.toggle("active");
      button.textContent =
        button.classList.contains("active") ? "Network (clicked)" : "Network";
    });
  </script>
